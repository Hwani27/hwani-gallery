<body class="toss-app game-omok app-mode">
<div id="omok" class="screen active">
  <div class="backbar"><button class="backbtn" onclick="backToLauncher()">← 메뉴</button></div>
  <div class="g2d">
    <div class="mount3d" id="omokMount"></div>
    <div class="hudtop">
      <h1>오목</h1>
      <div class="status"><span id="omokStatus">흑 차례</span></div>
      <div class="toolbar">
        <button id="omokSndBtn" onclick="omokToggleSnd()">🔊</button>
        <button id="omokRenjuBtn" onclick="Omok.toggleRenju()">금수 ON</button>
        <button onclick="Omok.hint()">💡 힌트</button>
        <button id="omok2dBtn" onclick="Omok.toggle2D()">2D 보기</button>
        <button onclick="Omok.undo()">무르기</button>
        <button onclick="Omok.resign()">🏳️ 기권</button>
        <button onclick="Omok.restart()">다시</button>
        <button onclick="Omok.openSetup()">모드</button>
      </div>
    </div>
    <div class="zoom3d">
      <button onclick="Omok.zoom(-1)">+</button>
      <button onclick="Omok.zoom(1)">−</button>
      <button onclick="Omok.resetView()">⟲</button>
    </div>
  </div>
  <div class="winbanner" id="omokWin"></div>
  <div class="setupmodal" id="omokSetup">
    <h2>오목</h2>
    <div class="modes">
      <div class="mcard" onclick="Omok.start('pvp')"><div class="ic">👥</div><h3>사람 vs 사람</h3><small>번갈아 두기</small></div>
      <div class="mcard" onclick="Omok.chooseCPU()"><div class="ic">🤖</div><h3>사람 vs CPU</h3><small>흑으로 대결</small></div>
      <div class="mcard" onclick="Omok.openStages()"><div class="ic">🕹️</div><h3>스테이지</h3><small>1~10단계 클리어</small></div>
    </div>
    <div id="omokDiff" class="hidden">
      <p>CPU 난이도</p>
      <div class="diffrow">
        <button class="btn ghost" onclick="Omok.start('cpu',1)">쉬움</button>
        <button class="btn ghost" onclick="Omok.start('cpu',2)">보통</button>
        <button class="btn ghost" onclick="Omok.start('cpu',3)">어려움</button>
      </div>
    </div>
    <div id="omokStages" class="hidden">
      <p>스테이지 선택 <span id="omokProgress" style="color:#c39a3e"></span></p>
      <div class="stage-grid2" id="omokStageGrid"></div>
      <p style="font-size:11px;color:#9a8c70;max-width:280px">숫자가 클수록 CPU가 강해집니다. ⭐는 클리어한 단계예요.</p>
    </div>
  </div>
  <div class="stage-end2" id="omokStageEnd"></div>
</div>
