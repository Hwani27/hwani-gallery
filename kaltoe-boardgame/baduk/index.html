<body class="toss-app game-baduk app-mode">
<div id="baduk" class="screen active">
  <div class="backbar"><button class="backbtn" onclick="backToLauncher()">← 메뉴</button></div>
  <div class="g2d">
    <div class="mount3d" id="badukMount"></div>
    <div class="hudtop">
      <h1>바둑 (9×9)</h1>
      <div class="status"><span id="badukStatus">흑 차례</span></div>
      <div class="toolbar">
        <button id="badukSndBtn" onclick="badukToggleSnd()">🔊</button>
        <button onclick="BadukTutorial.open()">❓ 규칙</button>
        <button onclick="Baduk.hint()">💡 힌트</button>
        <button onclick="Baduk.pass()">착수 포기</button>
        <button onclick="Baduk.scoreNow()">집 계산</button>
        <button id="baduk2dBtn" onclick="Baduk.toggle2D()">2D 보기</button>
        <button onclick="Baduk.undo()">무르기</button>
        <button onclick="Baduk.resign()">🏳️ 기권</button>
        <button onclick="Baduk.restart()">다시</button>
        <button onclick="Baduk.openSetup()">모드</button>
      </div>
    </div>
    <div class="zoom3d">
      <button onclick="Baduk.zoom(-1)">+</button>
      <button onclick="Baduk.zoom(1)">−</button>
      <button onclick="Baduk.resetView()">⟲</button>
    </div>
  </div>
  <div class="winbanner" id="badukWin"></div>
  <div class="setupmodal" id="badukSetup">
    <h2>바둑</h2>
    <p style="font-size:13px;color:#c39a3e;margin:-4px 0 2px">판 크기</p>
    <div class="diffrow" id="badukSizeRow">
      <button class="btn ghost bdsize" data-n="9" onclick="Baduk.setSize(9)">9×9</button>
      <button class="btn ghost bdsize" data-n="13" onclick="Baduk.setSize(13)">13×13</button>
      <button class="btn ghost bdsize" data-n="19" onclick="Baduk.setSize(19)">19×19</button>
    </div>
    <p style="font-size:11px;color:#9a8c70;max-width:300px;margin:2px 0 8px">9×9 입문 · 13×13 중급 · 19×19 정규(사람끼리 추천)</p>
    <div class="modes">
      <div class="mcard" onclick="Baduk.start('pvp')"><div class="ic">👥</div><h3>사람 vs 사람</h3><small>번갈아 두기</small></div>
      <div class="mcard" onclick="Baduk.chooseCPU()"><div class="ic">🤖</div><h3>사람 vs CPU</h3><small>흑으로 대결</small></div>
      <div class="mcard" onclick="Baduk.openStages()"><div class="ic">🏆</div><h3>아케이드</h3><small>스테이지 1~10</small></div>
      <div class="mcard" onclick="BadukTutorial.open()"><div class="ic">📖</div><h3>규칙 배우기</h3><small>처음이라면 여기부터</small></div>
    </div>
    <div id="badukDiff" class="hidden">
      <p>CPU 난이도</p>
      <div class="diffrow">
        <button class="btn ghost" onclick="Baduk.start('cpu',1)">쉬움</button>
        <button class="btn ghost" onclick="Baduk.start('cpu',2)">보통</button>
        <button class="btn ghost" onclick="Baduk.start('cpu',3)">어려움</button>
      </div>
    </div>
    <div id="badukStages" class="hidden">
      <p>스테이지 선택 <span id="badukProgress" style="color:#c39a3e"></span></p>
      <div class="stage-grid2" id="badukStageGrid"></div>
      <p style="font-size:11px;color:#9a8c70;max-width:300px">9×9 판에서 진행해요. 스테이지가 오를수록 CPU가 더 오래 수를 읽고, 백에게 주는 덤도 0.5 → 3.5 → 6.5집으로 늘어나요.</p>
    </div>
    <p style="font-size:11px;color:#9a8c70;max-width:300px">양쪽 모두 착수 포기하면 사석을 판정한 뒤 중국식 계가로 승부를 냅니다. 덤 6.5집.</p>
  </div>
  <div class="stage-end2" id="badukStageEnd"></div>
  <div class="unotut" id="badukTutorial">
    <div class="unotut-box">
      <div class="unotut-progress" id="badukTutProgress"></div>
      <h2 id="badukTutTitle"></h2>
      <div class="unotut-visual" id="badukTutVisual"></div>
      <p id="badukTutBody"></p>
      <div class="unotut-nav">
        <button class="btn ghost" id="badukTutSkip" onclick="BadukTutorial.close()">건너뛰기</button>
        <div style="flex:1"></div>
        <button class="btn ghost" id="badukTutPrev" onclick="BadukTutorial.prev()">← 이전</button>
        <button class="btn" id="badukTutNext" onclick="BadukTutorial.next()">다음 →</button>
      </div>
    </div>
  </div>
</div>
