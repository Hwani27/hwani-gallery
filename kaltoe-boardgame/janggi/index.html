<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14100c">
<meta name="description" content="인턴부터 사장까지, 한 판씩 이겨서 칼퇴하자">
<title>칼퇴 보드게임 · 장기</title>
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="../main.css">
<link rel="stylesheet" href="../uix.css">
<link rel="stylesheet" href="../nosel.css">
<link rel="stylesheet" href="../meta.css">
</head>
<body class="toss-app game-janggi app-mode">
<div id="janggi" class="screen active">
  <div class="backbar"><button class="backbtn" onclick="backToLauncher()">← 메뉴</button></div>
  <div class="g2d">
    <div class="mount3d" id="janggiMount"></div>
    <div class="hudtop">
      <h1>장기 (한국 장기)</h1>
      <div class="status"><span id="janggiStatus">초 차례</span></div>
      <div class="toolbar">
        <button id="janggiSndBtn" onclick="janggiToggleSnd()">🔊</button>
        <button onclick="JanggiTutorial.open()">❓ 규칙</button>
        <button onclick="Janggi.hint()">💡 힌트</button>
        <button id="janggi2dBtn" onclick="Janggi.toggle2D()">2D 보기</button>
        <button onclick="Janggi.undo()">무르기</button>
        <button onclick="Janggi.resign()">🏳️ 기권</button>
        <button onclick="Janggi.restart()">다시</button>
        <button onclick="Janggi.openSetup()">모드</button>
      </div>
    </div>
    <div class="zoom3d">
      <button onclick="Janggi.zoom(-1)">+</button>
      <button onclick="Janggi.zoom(1)">−</button>
      <button onclick="Janggi.resetView()">⟲</button>
    </div>
  </div>
  <div class="winbanner" id="janggiWin"></div>
  <div class="setupmodal" id="janggiSetup">
    <h2>장기</h2>
    <div class="modes">
      <div class="mcard" onclick="Janggi.start('pvp')"><div class="ic">👥</div><h3>사람 vs 사람</h3><small>번갈아 두기</small></div>
      <div class="mcard" onclick="Janggi.chooseCPU()"><div class="ic">🤖</div><h3>사람 vs CPU</h3><small>초(아래)로 대결</small></div>
      <div class="mcard" onclick="Janggi.openStages()"><div class="ic">🕹️</div><h3>스테이지</h3><small>1~10단계 클리어</small></div>
      <div class="mcard" onclick="JanggiTutorial.open()"><div class="ic">📖</div><h3>규칙 배우기</h3><small>처음이라면 여기부터</small></div>
    </div>
    <div id="janggiDiff" class="hidden">
      <p>CPU 난이도</p>
      <div class="diffrow">
        <button class="btn ghost" onclick="Janggi.start('cpu',1)">쉬움</button>
        <button class="btn ghost" onclick="Janggi.start('cpu',2)">보통</button>
        <button class="btn ghost" onclick="Janggi.start('cpu',3)">어려움</button>
      </div>
    </div>
    <div id="janggiStages" class="hidden">
      <p>스테이지 선택 <span id="janggiProgress" style="color:#c39a3e"></span></p>
      <div class="stage-grid2" id="janggiStageGrid"></div>
      <p style="font-size:11px;color:#9a8c70;max-width:280px">숫자가 클수록 CPU가 강해집니다. ⭐는 클리어한 단계예요.</p>
    </div>
  </div>
  <div class="stage-end2" id="janggiStageEnd"></div>
  <div class="unotut" id="janggiTutorial">
    <div class="unotut-box">
      <div class="unotut-progress" id="janggiTutProgress"></div>
      <h2 id="janggiTutTitle"></h2>
      <div class="unotut-visual" id="janggiTutVisual"></div>
      <p id="janggiTutBody"></p>
      <div class="unotut-nav">
        <button class="btn ghost" id="janggiTutSkip" onclick="JanggiTutorial.close()">건너뛰기</button>
        <div style="flex:1"></div>
        <button class="btn ghost" id="janggiTutPrev" onclick="JanggiTutorial.prev()">← 이전</button>
        <button class="btn" id="janggiTutNext" onclick="JanggiTutorial.next()">다음 →</button>
      </div>
    </div>
  </div>
</div>

<script>window.APP_MODE=true;window.APP_PLATFORM="web";window.GAME_ID="janggi";window.APP_NAME="kaltoe-boardgame";window.AD_GROUP_ID="ait.v2.live.0e05728cf6304647";window.BANNER_AD_GROUP_ID="ait.v2.live.094d2907f14849b3";window.REWARD_AD_GROUP_ID="ait.v2.live.02a26293252949fe";window.NOADS_SKU="";window.TURN_API="";window.TURN_AGREEMENT="";window.PROMO={"attend":{"code":"","amount":1},"firstGame":{"code":"","amount":1},"invite":{"code":"","amount":1}};window.VIRAL_MODULE="";</script>

<script src="../js/social.js"></script>
<script src="../js/app-shell.js"></script>
<script src="../js/puzzles-janggi.js"></script>
<script src="../js/daily-puzzle.js"></script>
<script src="../js/review.js"></script>
<script src="../js/monetize.js"></script>
<script src="../js/progress.js"></script>
<script src="../js/rush.js"></script>
<script src="../js/characters.js"></script>
<script src="../js/chest.js"></script>
<script src="../js/growth.js"></script>
<script src="../js/story.js"></script>
<script src="../js/fun.js"></script>
<script src="../js/settings-ui.js"></script>

</body></html>
