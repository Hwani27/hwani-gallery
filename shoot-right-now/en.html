<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10140e">
<meta name="description" content="Shoot Right Now — a block-world military rail shooter: sixteen missions from the fall of Seoul to the Incheon landing, Panmunjom, Pyongyang and Paektu.">
<title>Shoot Right Now</title>
<style>
  :root{--khaki:#c9b871;--olive:#2f3a22}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0d1109;overflow:hidden;color:#eef1e6;
    font-family:Inter,"Helvetica Neue",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
  /* (v61) the page itself never scrolls or rubber-bands: iOS Safari's toolbar
     sliding in/out used to leave the bottom-fixed buttons' touch areas offset */
  html{overscroll-behavior:none}
  body{position:fixed;inset:0;width:100%;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #mgCanvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#8ec7ee}
  /* ---- title ---- */
  #mgTitle{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
    padding:max(26px,env(safe-area-inset-top)) 22px max(26px,env(safe-area-inset-bottom));
    overflow:auto;text-align:center;
    background:
      radial-gradient(120% 88% at 50% 0%,rgba(64,80,42,.62),rgba(8,11,6,.95) 62%),
      repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 2px,transparent 2px 9px),
      #0b0f08}
  #mgTitle.show{display:flex}
  #mgTitle:before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(70% 55% at 50% 46%,rgba(201,184,113,.13),transparent 70%)}
  .tWrap{position:relative;width:min(520px,100%);margin:auto}
  .tKicker{margin:0 0 16px;font:800 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.34em;color:var(--khaki);text-transform:uppercase}
  .tKicker:before,.tKicker:after{content:"";display:inline-block;width:26px;height:1px;
    background:var(--khaki);vertical-align:middle;opacity:.75;margin:0 10px}
  h1{margin:0;font-size:clamp(38px,10.5vw,64px);font-weight:900;letter-spacing:-.035em;line-height:1;
    text-transform:uppercase;
    text-shadow:0 4px 0 rgba(0,0,0,.5),0 0 44px rgba(201,184,113,.28)}
  h1 em{font-style:normal;color:var(--khaki)}
  .tSub{margin:16px 0 28px;font-size:clamp(13px,3.6vw,15px);color:#b9c2ab}
  .tStart{display:block;width:100%;min-height:66px;border:2px solid var(--khaki);border-radius:14px;
    background:linear-gradient(180deg,#4c5c2d,#2b3520);color:#fff;
    font:900 clamp(17px,4.4vw,20px)/1.15 inherit;letter-spacing:.03em;cursor:pointer;
    box-shadow:0 12px 28px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.16);
    touch-action:manipulation}
  .tStart span{display:block;margin-top:5px;font:700 11px/1 ui-monospace,monospace;letter-spacing:.22em;color:#d6cfa4}
  .tStart:active{transform:translateY(1px);filter:brightness(1.07)}
  .tStart.alt{margin-top:10px;min-height:56px;font-size:clamp(14px,4vw,17px);border-color:#8fa9b8;
    background:linear-gradient(180deg,#2f4a56,#1d2f38);box-shadow:0 8px 20px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12)}
  .tStart.alt span{color:#a9c6d2}
  .tHint{margin:18px 0 0;font-size:13px;color:#98a28c}
  .tHint b{color:#e6e2cf;font-weight:800}
  .tSound{display:inline-flex;align-items:center;gap:8px;margin-top:18px;border:1px solid rgba(201,184,113,.45);background:rgba(255,255,255,.05);
    color:#d9ddcd;border-radius:999px;padding:10px 18px;font:700 13px/1 inherit;cursor:pointer;touch-action:manipulation}
  .tSound svg{flex:none}
  #mgGfx{margin-left:6px}
  .tStart.alt3{background:linear-gradient(#4a4f5a,#2c3038);border-color:#c8d0dc;margin-top:10px;min-height:52px}
  .tSound{vertical-align:middle}
  .tSound.off .w1,.tSound.off .w2{opacity:.12}
  .tSound.off{color:#8d9583}
  .tFoot{margin:26px 0 0;font:700 10px/1.5 ui-monospace,monospace;letter-spacing:.2em;color:#5d6752}
  #mgErr{position:fixed;left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom));z-index:70;
    padding:14px 16px;border-radius:12px;background:#3a1b16;color:#ffd9cf;font-size:14px;line-height:1.5}
  @media (max-height:560px){h1{font-size:clamp(28px,7.5vw,42px)}.tSub{margin:10px 0 18px}.tFoot{display:none}}
</style>
</head>
<body>
<canvas id="mgCanvas"></canvas>

<div id="mgTitle" class="show">
  <div class="tWrap"></div>
</div>

<div id="mgErr" hidden></div>
<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;margin:0;background:#0b0f08;color:#eef1e6">Turn on JavaScript to start the mission.</p></noscript>

<script src="three.min.js"></script>
<script src="vendor/GLTFLoader.js?v=1"></script>
<script src="post.js?v=67"></script>
<script src="story.js?v=67"></script>
<script src="profile.js?v=67"></script>
<script src="engine.js?v=67"></script>
<script src="gun-sfx.js?v=67"></script>
<script src="ads.js?v=67"></script>
<script src="rail.js?v=67"></script>
</body>
</html>
