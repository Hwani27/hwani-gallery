<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>지금 바로 멸공</title>
</head>
<body>
<p id="mgLoad" style="font:16px sans-serif;padding:24px">지금 바로 점프 엔진을 불러오는 중…</p>
<script>
(async function () {
  const ORIG = "../baro-baro-jump/index.html";
  let html = await (await fetch(ORIG)).text();
  html = html.replaceAll("url(./fonts/", "url(../baro-baro-jump/fonts/");
  html = html.replaceAll('src="icons/', 'src="../baro-baro-jump/icons/');
  html = html.replaceAll('href="icons/', 'href="../baro-baro-jump/icons/');
  html = html.replaceAll("지금 바로 점프", "지금 바로 멸공");
  const step = "function stepPlayer(inp){const p=pl;";
  const cam = 'placeCamera(false);bossCam53();space54(dt);crayon58(dt);fx59(dt);bk59(dt);bossBar59();updLights();updateHUD();hud53();updBossBar();speedFx5(state==="play"&&RUN5.sprinting());postRender52(scene,camera)';
  const rail = 'try{window.__railCtx={scene:scene,camera:camera,renderer:renderer,enemies:enemies,pl:pl,player:player,L:L,W3:W3,G:G,LT:LT,M:M,BOSSK:BOSSK,snd:snd,makeHero:makeHero,makeFoe:makeFoe,makePillager:makePillager,makeCybertruck:makeCybertruck,killFlip:killFlip,hitFlash:hitFlash,hitBoss:hitBoss,addScore:addScore,setState:function(v){state=v}};}catch(e){}try{window.RAIL&&RAIL.frame(window.__railCtx)}catch(e){}postRender52(scene,camera)';
  if (!html.includes(step) || !html.includes(cam)) throw new Error("engine hook missing");
  html = html.replace(step, "function stepPlayer(inp){if(window.RAIL&&RAIL.hold)return;const p=pl;");
  html = html.replace(cam, cam.replace("postRender52(scene,camera)", rail));
  const boot = '<script>(function(){var G="blockaction"';
  if (!html.includes(boot)) throw new Error("boot missing");
  html = html.replace(boot, '<script src="gun-sfx.js"><\/script><script src="rail.js"><\/script>' + boot);
  const doc = new DOMParser().parseFromString(html, "text/html");
  document.replaceChild(document.importNode(doc.documentElement, true), document.documentElement);
  const scripts = [...document.scripts];
  for (const old of scripts) {
    const s = document.createElement("script");
    for (const attr of old.attributes) s.setAttribute(attr.name, attr.value);
    if (!old.src) s.textContent = old.textContent;
    s.async = false;
    old.replaceWith(s);
    if (s.src) await new Promise((done) => { s.onload = s.onerror = done; });
  }
})().catch((e) => {
  const p = document.getElementById("mgLoad");
  if (p) p.textContent = "불러오기 실패: " + (e && e.message || e);
});
</script>
</body>
</html>
