<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>정환의 작품 모음</title>
<style>
  :root{--gold:#e8c27a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#05060a;color:#eef0f5;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    background-image:radial-gradient(1px 1px at 20% 30%,#fff8,transparent),radial-gradient(1px 1px at 70% 60%,#fff6,transparent),radial-gradient(1.5px 1.5px at 40% 80%,#fff7,transparent),radial-gradient(1px 1px at 85% 20%,#fff9,transparent),radial-gradient(1px 1px at 10% 70%,#fff5,transparent);background-size:300px 300px}
  header{padding:48px 24px 24px;max-width:1100px;margin:0 auto}
  .brand{font-family:Georgia,serif;font-style:italic;letter-spacing:.3em;color:var(--gold);font-size:12px}
  h1{margin:8px 0 6px;font-size:28px}
  p.sub{margin:0;color:#aab0bf;font-size:15px}
  main{max-width:1100px;margin:0 auto;padding:12px 24px 64px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
  a.card{display:block;text-decoration:none;color:inherit;border-radius:18px;overflow:hidden;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(10px);transition:transform .25s,border-color .25s}
  a.card:hover{transform:translateY(-4px);border-color:var(--gold)}
  a.card img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
  .body{padding:16px 18px 20px}
  .body h2{margin:0 0 6px;font-size:19px}
  .body p{margin:0;color:#aab0bf;font-size:14px;line-height:1.5}
  .soon{opacity:.55;pointer-events:none}
  .ph{aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 50%,#1b3a6b,#05060a 70%);font-size:56px}
</style>
</head>
<body>
<header>
  <div class="brand">HWANI GALLERY</div>
  <h1>작품 모음</h1>
  <p class="sub">눌러서 바로 열어 보세요.</p>
</header>
<main>
  <a class="card" href="minecraft-ore-dex/">
    <img src="minecraft-ore-dex/thumb.png" alt="광물 도감 화면">
    <div class="body"><h2>광물 도감</h2><p>마인크래프트 광석, 광물, 암석 99종을 3D 블록으로 돌려 보고, 직접 캐 볼 수 있어요.</p></div>
  </a>
  <a class="card" href="minecraft-mob-dex/">
    <img src="minecraft-mob-dex/thumb.png" alt="캐릭터 도감 화면">
    <div class="body"><h2>캐릭터 도감</h2><p>마인크래프트 공식 캐릭터 95종과, 팬이 만든 괴담 17편을 3D로 돌려 봐요.</p></div>
  </a>
  <a class="card" href="lumen/">
    <img src="lumen/thumb.png" alt="루멘 화면">
    <div class="body"><h2>루멘</h2><p>지구에서 우주 끝까지 날아가는 3D 우주 여행. 행성 체중계, 빛이랑 경주, 우주정거장, 서울 밤하늘 별자리도 있어요.</p></div>
  </a>
  <a class="card" href="https://hwani27.github.io/board-games/">
    <img src="board-games-thumb.png" alt="미니 게임 모음 화면">
    <div class="body"><h2>미니 게임 모음</h2><p>마인크래프트 마리오, 마인크래프트 파이터, 체스, 오목, 장기, 바둑, UNO를 한곳에서 즐겨요.</p></div>
  </a>
</main>
</body>
</html>
